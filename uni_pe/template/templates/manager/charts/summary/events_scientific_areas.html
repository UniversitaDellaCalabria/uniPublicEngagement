{% load i18n %}
{% load pe_management_tags %}

{% pem_settings_value "DASHBOARD_MANAGER_KPI_LIST" as titles %}
<div class="col-12">
  <div class="card-wrapper card-space">
    <div class="card card-bg no-after">
      <div class="card-body">
        <p class="card-title h5">
          {% for title in titles %}
          {% if title.0 == "events_scientific_areas" %}
          {{ title.1 }}
          {% endif %}
          {% endfor %}
        </p>
        <div id="app_events_scientific_areas">
          <div v-if="error">
            <div class="alert alert-danger" role="alert">
              Recupero dei dati non riuscito. Controlla i parametri di ricerca
            </div>
          </div>
          <div id="chart_events_scientific_areas" v-else></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var options_events_scientific_areas = {
    labels: [],
    series: [],
    chart: {
      type: 'donut',
    },
    legend: {
      position: 'right',
      verticalAlign: 'middle',
      width: 200,
    },
    responsive: [{
      breakpoint: 480,
      options: {
        legend: {
          position: 'bottom',
          width: "100%"
        }
      }
    }]
  };
  
  const app_events_scientific_areas = Vue.createApp({
    delimiters: ['[[', ']]'],
    data () {
      return {
        error: false
      }
    },
    mounted () {
      this.getCounters()
    },
    methods: {
      myFunction(item) {
        options_events_scientific_areas.labels.push(item.description)
        options_events_scientific_areas.series.push(item.number)
      },
      getCounters() {
        axios
        .get("{{ api_url }}", {
          params: {
            year: "{{ year }}"
          }
        })
        .then(response => {
          this.error_msg = ""
          this.error_status = null
          response.data.forEach(this.myFunction)
          var chart = new ApexCharts(document.querySelector("#chart_events_scientific_areas"), options_events_scientific_areas)
          chart.render()
        })
        .catch(error => {
          if(error) {
            this.error = true
            this.error_msg = error.response.data.detail
            this.error_status = error.response.status
          }
        })
      },
    }
  }).mount('#app_events_scientific_areas')
  
</script>
