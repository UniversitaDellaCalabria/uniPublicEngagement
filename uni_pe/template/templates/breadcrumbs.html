{% load i18n %}
{% load static %}


{% if breadcrumbs %}
<ul class="navbar-nav">
    {% for k,v in breadcrumbs.items %}
    {% if forloop.last %}
    <li class="nav-item d-none d-md-block">
        <a href="{{ k }}" class="nav-link">{{ v|truncatechars:40 }}</a>
    </li>
    {% else %}
    <li class="nav-item d-none d-md-block">
        <a href="{{ k }}" class="nav-link">{{ v|truncatechars:25 }}</a>
    </li>
    {% endif %}
    {% endfor %}
</ul>
{% endif %}
