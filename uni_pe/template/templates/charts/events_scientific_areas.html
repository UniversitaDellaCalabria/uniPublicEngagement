{% load i18n %}
{% load pe_management_tags %}

<div class="col-12">
  <div class="card-wrapper card-space">
    <div class="card card-bg no-after">
      <div class="card-body">
        <p class="card-title h5">
          {% trans "Numero delle iniziative per Area Scientifico Disciplinare" %}
          ({% trans "valori assoluti" %}, {% trans "year" %} {{ request.GET.year }})
        </p>
        <div id="app_events_scientific_areas">
          <div v-if="error">
            <div class="alert alert-danger" role="alert">
              Recupero dei dati non riuscito. Controlla i parametri di ricerca
            </div>
          </div>
          <div id="chart_events_scientific_areas" v-else></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Configurazione iniziale per le Aree Scientifiche
  var options_events_scientific_areas = {
    series: [{
      data: []
    }],
    chart: {
      type: 'bar',
      height: 400 // Altezza base
    },
    plotOptions: {
      bar: {
        barHeight: '75%', 
        distributed: true,
        horizontal: true,
      }
    },
    colors: ['#33b2df', '#546E7A', '#d4526e', '#13d8aa', '#A5978B', '#2b908f', '#f9a3a4', '#90ee7e', '#f48024', '#69d2e7'],
    dataLabels: {
      enabled: false // Disabilitati
    },
    stroke: {
      width: 1,
      colors: ['#fff']
    },
    xaxis: {
      categories: [],
    },
    yaxis: {
      labels: {
        show: true
      }
    },
    tooltip: {
      theme: 'dark',
      x: { show: false },
      y: {
        title: {
          formatter: function () { return '' }
        }
      }
    }
  };

  const app_events_scientific_areas = Vue.createApp({
    delimiters: ['[[', ']]'],
    data() {
      return {
        error: false,
        error_msg: "",
        error_status: null
      }
    },
    mounted() {
      this.getCounters()
    },
    methods: {
      myFunction(item) {
        // Nota: utilizzo item.description e item.number come nel tuo esempio originale
        options_events_scientific_areas.xaxis.categories.push(item.description)
        options_events_scientific_areas.series[0].data.push(item.number)
      },
      getCounters() {
        axios
          .get("{{ api_url }}", {
            params: { year: "{{ year }}", structure: "{{ structure }}"}
          })
          .then(response => {
            const data = response.data;
            this.error = false;
            
            // Popolamento dati
            data.forEach(this.myFunction);

            // CALCOLO ALTEZZA DINAMICA
            // 45px per area scientifica + 100px di margine per gli assi
            const dynamicHeight = (data.length * 45) + 100;
            options_events_scientific_areas.chart.height = Math.max(dynamicHeight, 350);

            // Inizializzazione del grafico
            var chart = new ApexCharts(document.querySelector("#chart_events_scientific_areas"), options_events_scientific_areas);
            chart.render();
          })
          .catch(error => {
            if (error.response) {
              this.error = true;
              this.error_msg = error.response.data.detail;
              this.error_status = error.response.status;
            }
          });
      },
    }
  }).mount('#app_events_scientific_areas')
</script>
