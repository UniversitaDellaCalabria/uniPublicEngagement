{% load i18n %}
{% load pe_management_tags %}

<div class="col-12">
  <div class="card-wrapper card-space">
    <div class="card card-bg no-after">
      <div class="card-body">
        <p class="card-title h5">
          {% trans "Elenco nominativi dei referenti Unical che hanno registrano attività/iniziativa di PE" %}
          ({% trans "valori assoluti" %}, {% trans "year" %} {{ request.GET.year }})
        </p>
        <div id="app_events_referents">
          <div v-if="error">
            <div class="alert alert-danger" role="alert">
              {% trans "Data retrieval failed. Please check your search parameters" %}
            </div>
          </div>
          <div id="chart_events_referents" v-else></div>
        </div>
      </div>
    </div>
  </div>
</div>


<script>
  // Definiamo le opzioni base senza l'altezza e senza dati
  var options_events_referents = {
    series: [{
      data: []
    }],
    chart: {
      type: 'bar',
      height: 400 // Altezza di default iniziale
    },
    plotOptions: {
      bar: {
        barHeight: '70%', // Meglio 70% per lasciare un po' di spazio tra le barre
        distributed: true,
        horizontal: true,
        dataLabels: {
          position: 'bottom'
        },
      }
    },
    colors: ['#33b2df', '#546E7A', '#d4526e', '#13d8aa', '#A5978B', '#2b908f', '#f9a3a4', '#90ee7e', '#f48024', '#69d2e7'],
    dataLabels: {
      enabled: false, // Attivato per mostrare i valori
    },
    stroke: {
      width: 1,
      colors: ['#fff']
    },
    xaxis: {
      categories: [],
    },
    yaxis: {
      labels: {
        show: true
      }
    },
    tooltip: {
      theme: 'dark',
      x: { show: false },
      y: {
        title: {
          formatter: function () { return '' }
        }
      }
    }
  };

  const app_events_referents = Vue.createApp({
    delimiters: ['[[', ']]'],
    data() {
      return {
        error: false,
        error_msg: "",
        error_status: null
      }
    },
    mounted() {
      this.getCounters()
    },
    methods: {
      myFunction(item) {
        options_events_referents.xaxis.categories.push(item.referent__last_name + " " + item.referent__first_name)
        options_events_referents.series[0].data.push(item.num)
      },
      getCounters() {
        axios
          .get("{{ api_url }}", {
            params: { year: "{{ year }}" }
          })
          .then(response => {
            const data = response.data;
            
            // 1. Popoliamo i dati tramite myFunction
            data.forEach(this.myFunction);

            // 2. Calcoliamo l'altezza dinamica (es. 45px per ogni barra + 100px di margine per assi/titoli)
            const calculatedHeight = (data.length * 45) + 100;
            
            // 3. Applichiamo l'altezza calcolata alle opzioni
            options_events_referents.chart.height = calculatedHeight;

            // 4. Inizializziamo il grafico DOPO aver calcolato l'altezza
            var chart = new ApexCharts(document.querySelector("#chart_events_referents"), options_events_referents);
            chart.render();
          })
          .catch(error => {
            if (error.response) {
              this.error_msg = error.response.data.detail;
              this.error_status = error.response.status;
            }
          });
      },
    }
  }).mount('#app_events_referents')
</script>
