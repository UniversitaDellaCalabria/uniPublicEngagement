{% load i18n %}
{% load pe_management_tags %}

{% pem_settings_value "DASHBOARD_MANAGER_KPI_LIST" as titles %}
<div class="col-12">
  <div class="card-wrapper card-space">
    <div class="card card-bg no-after">
      <div class="card-body">
        <p class="card-title h5">
          {% for title in titles %}
          {% if title.0 == "events_patronage_requested" %}
          {{ title.1 }}
          {% endif %}
          {% endfor %}
        </p>
        <div id="app_events_patronage_requested">
          <div v-if="error">
            <div class="alert alert-danger" role="alert">
              {% trans "Data retrieval failed. Please check your search parameters" %}
            </div>
          </div>
          <div id="chart_events_patronage_requested" v-else></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var options_events_patronage_requested = {
    labels: [],
    series: [],
    chart: {
      type: 'donut',
    },
    legend: {
      position: 'right',
      verticalAlign: 'middle',
      width: 200,
    },
    responsive: [{
      breakpoint: 480,
      options: {
        legend: {
          position: 'bottom',
          width: "100%"
        }
      }
    }]
  };
  
  const app_events_patronage_requested = Vue.createApp({
    delimiters: ['[[', ']]'],
    data () {
      return {
        error: false
      }
    },
    mounted () {
      this.getCounters()
    },
    methods: {
      myFunction(item) {
        for (const [key, value] of Object.entries(item)) {
          let label = "Si"
          let num = value
          if(key == 'no') {
            label = "No"
          }
          options_events_patronage_requested.labels.push(label)
          options_events_patronage_requested.series.push(num)
        }
      },
      getCounters() {
        axios
        .get("{{ api_url }}", {
          params: {
            year: "{{ year }}"
          }
        })
        .then(response => {
          this.error_msg = ""
          this.error_status = null
          this.myFunction(response.data)
          var chart = new ApexCharts(document.querySelector("#chart_events_patronage_requested"), options_events_patronage_requested)
          chart.render()
        })
        .catch(error => {
          if(error) {
            this.error = true
            this.error_msg = error.response.data.detail
            this.error_status = error.response.status
          }
        })
      },
    }
  }).mount('#app_events_patronage_requested')
  
</script>
