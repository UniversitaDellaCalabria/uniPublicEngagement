{% load i18n %}
{% load pe_management_tags %}

<div class="col-12">
  <div class="card-wrapper card-space">
    <div class="card card-bg no-after">
      <div class="card-body">
        <p class="card-title h5">
          {% trans "Elenco dei nominativi di altro personale Unical coinvolto nelle iniziative di PE" %}
          ({% trans "year" %} {{ request.GET.year }})
        </p>
        <div id="app_events_involved_personnel">
          <div v-if="error">
            <div class="alert alert-danger" role="alert">
              {% trans "Data retrieval failed. Please check your search parameters" %}
            </div>
          </div>
          <div id="chart_events_involved_personnel" v-else></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Configurazione base per il Personale Coinvolto
  var options_events_involved_personnel = {
    series: [{
      data: []
    }],
    chart: {
      type: 'bar',
      height: 400 // Altezza iniziale di fallback
    },
    plotOptions: {
      bar: {
        barHeight: '70%', // Lascia spazio tra i nomi per migliorare la lettura
        distributed: true,
        horizontal: true,
      }
    },
    colors: ['#33b2df', '#546E7A', '#d4526e', '#13d8aa', '#A5978B', '#2b908f', '#f9a3a4', '#90ee7e', '#f48024', '#69d2e7'],
    dataLabels: {
      enabled: false // Disabilitati per pulizia
    },
    stroke: {
      width: 1,
      colors: ['#fff']
    },
    xaxis: {
      categories: [],
    },
    yaxis: {
      labels: {
        show: true
      }
    },
    tooltip: {
      theme: 'dark',
      x: { show: false },
      y: {
        title: {
          formatter: function () { return '' }
        }
      }
    }
  };

  const app_events_involved_personnel = Vue.createApp({
    delimiters: ['[[', ']]'],
    data() {
      return {
        error: false,
        error_msg: "",
        error_status: null
      }
    },
    mounted() {
      this.getCounters()
    },
    methods: {
      myFunction(item) {
        options_events_involved_personnel.xaxis.categories.push(item.involved_personnel__last_name + " " + item.involved_personnel__first_name)
        options_events_involved_personnel.series[0].data.push(item.num)
      },
      getCounters() {
        axios
          .get("{{ api_url }}", {
            params: { year: "{{ year }}" }
          })
          .then(response => {
            const data = response.data;
            this.error = false;
            this.error_msg = "";
            this.error_status = null;

            // Popoliamo le categorie e i dati
            data.forEach(this.myFunction);

            // CALCOLO ALTEZZA DINAMICA
            // 45px per ogni persona + 100px di margine per asse e titoli
            const dynamicHeight = (data.length * 45) + 100;
            options_events_involved_personnel.chart.height = Math.max(dynamicHeight, 400);

            // Inizializzazione e rendering del grafico
            var chart = new ApexCharts(document.querySelector("#chart_events_involved_personnel"), options_events_involved_personnel);
            chart.render();
          })
          .catch(error => {
            if (error.response) {
              this.error = true;
              this.error_msg = error.response.data.detail;
              this.error_status = error.response.status;
            }
          });
      },
    }
  }).mount('#app_events_involved_personnel')
</script>
